app = "portfolio-craigdevjohnson"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_BIND_ALL = "true"
  LOG_FORMAT = "json"
  LOG_LEVEL = "info"
  LOG_ADD_SOURCE = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
