# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"
silent: true

vars:
  GOFLAGS: ""
  BINARY: '{{if eq OS "windows"}}portfolio-server.exe{{else}}portfolio-server{{end}}'
  BINARY_PATH: '{{if eq OS "windows"}}.\{{.BINARY}}{{else}}./{{.BINARY}}{{end}}'
  TAILWIND_VERSION: v4.2.4
  TAILWIND_DIR: .tools/tailwind
  TAILWIND_BIN: '{{if eq OS "windows"}}{{.TAILWIND_DIR}}/tailwindcss.exe{{else}}{{.TAILWIND_DIR}}/tailwindcss{{end}}'
  TAILWIND_INPUT: cmd/web/tailwind/app.css
  TAILWIND_OUTPUT: cmd/web/static/css/tailwind.css

tasks:
  default:
    desc: Build the project
    deps: [build]

  # ── Build ──────────────────────────────────────────────────────────────────

  generate:
    desc: Generate Templ components
    deps: [templ]

  templ:
    desc: Low-level Templ generation command used by generate
    cmds:
      - |
        if ! command -v templ >/dev/null 2>&1; then
          echo "Templ not found -- please run 'task install-templ' to install it"
          exit 1
        fi
        templ generate

  _tailwind-check:
    internal: true
    cmds:
      - |
        if [ ! -x "{{.TAILWIND_BIN}}" ]; then
          echo "Tailwind CLI not found -- please run 'task install-tailwind' to install it"
          exit 1
        fi

  tailwind-build:
    desc: Build Tailwind CSS from the CSS-first source files using the standalone CLI
    deps: [_tailwind-check]
    cmds:
      - '"{{.TAILWIND_BIN}}" -i "{{.TAILWIND_INPUT}}" -o "{{.TAILWIND_OUTPUT}}"'

  build:
    desc: Build the binary
    deps: [generate, tailwind-build]
    cmds:
      - "go build {{.GOFLAGS}} -o {{.BINARY}} ./cmd/server"

  # ── Run ────────────────────────────────────────────────────────────────────

  run:
    desc: Build and run the server
    deps: [build]
    dotenv: [".env"]
    cmds:
      - "{{.BINARY_PATH}}"

  portal-preview:
    desc: Build and run the mock management portal on loopback only
    deps: [build]
    dotenv: [".env"]
    env:
      APP_BIND_ALL: "false"
      HOST: "127.0.0.1"
      MGMT_LOCAL_PREVIEW: "true"
    cmds:
      - "{{.BINARY_PATH}}"

  compose:
    desc: Run with Docker Compose
    cmds:
      - |
        set -eu
        build_ca_bundle="$(mktemp)"
        trap 'rm -f "$build_ca_bundle"' EXIT

        if [ -n "${DOCKER_BUILD_CA_CERT_PATH:-}" ]; then
          if [ ! -r "$DOCKER_BUILD_CA_CERT_PATH" ]; then
            echo "Docker build CA certificate is not readable: $DOCKER_BUILD_CA_CERT_PATH"
            exit 1
          fi
          cp "$DOCKER_BUILD_CA_CERT_PATH" "$build_ca_bundle"
        elif command -v security >/dev/null 2>&1 \
          && [ -r /Library/Keychains/System.keychain ]; then
          security find-certificate -a -c "Gateway CA" -p \
            /Library/Keychains/System.keychain > "$build_ca_bundle" || true
        fi

        build_ca_digest=$(shasum -a 256 "$build_ca_bundle" | awk '{print $1}')
        DOCKER_BUILD_CA_CERT_PATH="$build_ca_bundle" \
        DOCKER_BUILD_CA_BUNDLE_DIGEST="$build_ca_digest" \
          docker compose -f docker-compose.yml up -d --build portfolio

  dev:
    desc: Run with air for hot-reload development
    cmds:
      - air

  tailwind-watch:
    desc: Watch Tailwind CSS source files and rebuild the generated stylesheet
    deps: [_tailwind-check]
    cmds:
      - '"{{.TAILWIND_BIN}}" -i "{{.TAILWIND_INPUT}}" -o "{{.TAILWIND_OUTPUT}}" --watch'

  # ── Quality ────────────────────────────────────────────────────────────────

  fmt:
    desc: Format files
    cmds:
      - printf "Formatting files...\n"
      - golangci-lint fmt

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Lint files
    deps: [fmt]
    cmds:
      - task: _lint-check

  _lint-check:
    internal: true
    cmds:
      - printf "Running linters to check code quality...\n"
      - golangci-lint run
      - printf "All linters passed!\n"

  ci:
    desc: Check quality, run tests and build
    cmds:
      - task: clean
      - task: fmt
      - task: vet
      - task: _lint-check
      - task: test
      - task: build

  # ── Test ───────────────────────────────────────────────────────────────────

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  # ── Clean ──────────────────────────────────────────────────────────────────

  clean:
    desc: Remove binary and clean cached files
    cmds:
      - '{{if eq OS "windows"}}powershell -Command "Remove-Item -Force {{.BINARY}} -ErrorAction SilentlyContinue"{{else}}rm -f {{.BINARY}}{{end}}'
      - go clean

  # ── Tools ──────────────────────────────────────────────────────────────────

  install-air:
    desc: Install air for hot-reload development
    cmds:
      - |
        if command -v air >/dev/null 2>&1; then
          echo "air is already installed -- skipping installation"
          exit 0
        fi
        echo "Installing air for hot-reload development..."
        curl -sSfL https://raw.githubusercontent.com/cosmtrek/air/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
        echo "air installed successfully!"

  install-tailwind:
    desc: Install the pinned Tailwind standalone CLI used by local builds, CI, and Docker
    cmds:
      - |
        set -eu
        os=$(uname -s)
        arch=$(uname -m)
        case "$os/$arch" in
          Darwin/arm64) asset="tailwindcss-macos-arm64" ;;
          Darwin/x86_64) asset="tailwindcss-macos-x64" ;;
          Linux/x86_64|Linux/amd64) asset="tailwindcss-linux-x64" ;;
          Linux/aarch64|Linux/arm64) asset="tailwindcss-linux-arm64" ;;
          *)
            echo "Unsupported platform for Tailwind CLI: $os/$arch"
            exit 1
            ;;
        esac
        mkdir -p "{{.TAILWIND_DIR}}"
        curl -fsSL -o "{{.TAILWIND_BIN}}" "https://github.com/tailwindlabs/tailwindcss/releases/download/{{.TAILWIND_VERSION}}/$asset"
        chmod +x "{{.TAILWIND_BIN}}"
        echo "Tailwind CLI {{.TAILWIND_VERSION}} installed to {{.TAILWIND_BIN}}"

  install-templ:
    desc: Install the Templ version used by this repository
    cmds:
      - go install github.com/a-h/templ/cmd/templ@v0.3.1020

  install-golangci-lint:
    desc: Install the golangci-lint version used by this repository
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0

  install-tools:
    desc: Install all development tools
    deps: [install-air, install-golangci-lint, install-tailwind, install-templ]
    cmds:
      - echo "All development tools installed successfully!"

  # ── Deploy ─────────────────────────────────────────────────────────────────

  _check-aws:
    internal: true
    cmds:
      - |
        set -eu
        for cmd in tofu aws docker; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            echo "$cmd not found -- see DEPLOY-INSTRUCTIONS.md for installation steps"
            exit 1
          fi
        done
        if ! aws sts get-caller-identity >/dev/null 2>&1; then
          echo "AWS credentials not configured -- run 'aws configure' or export AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY"
          exit 1
        fi

  _ecr-ensure-repo:
    internal: true
    cmds:
      - |
        set -eu
        cd infra
        if [ ! -d .terraform ]; then
          tofu init
        fi
        tofu apply -target=aws_ecr_repository.app -target=aws_ecr_lifecycle_policy.app --auto-approve

  _ecr-docker-push:
    internal: true
    vars:
      IMAGE_NAME: portfolio
      DOCKERFILE: Dockerfile
      IMAGE_TAG: latest
    cmds:
      - |
        set -eu
        ECR_URL=$(cd infra && tofu output -raw ecr_repository_url)
        AWS_REGION=$(echo "$ECR_URL" | sed 's/.*\.ecr\.\(.*\)\.amazonaws\.com.*/\1/')
        AWS_ACCOUNT_ID=$(echo "$ECR_URL" | sed 's/\..*//')
        aws ecr get-login-password --region "$AWS_REGION" | \
          docker login --username AWS --password-stdin \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
        docker build --platform linux/amd64 -f {{.DOCKERFILE}} -t {{.IMAGE_NAME}} .
        docker tag {{.IMAGE_NAME}}:latest "$ECR_URL:{{.IMAGE_TAG}}"
        docker push "$ECR_URL:{{.IMAGE_TAG}}"

  deploy:
    desc: Deploy the AWS infrastructure and both runtime images
    cmds:
      - task: _check-aws
      - task: _ecr-ensure-repo
      - task: _ecr-docker-push
      - task: _ecr-docker-push
        vars:
          IMAGE_NAME: portfolio-lambda
          DOCKERFILE: Dockerfile.lambda
          IMAGE_TAG: lambda-latest
      - |
        set -eu
        cd infra
        tofu apply --auto-approve
        echo "Deployment complete!"
        tofu output app_runner_service_url

  redeploy:
    desc: Push a new image and trigger App Runner redeployment
    cmds:
      - task: _ecr-docker-push
      - |
        set -eu
        SERVICE_ARN=$(cd infra && tofu output -raw app_runner_service_arn)
        aws apprunner start-deployment --service-arn "$SERVICE_ARN"
        echo "Redeployment triggered. Check status with:"
        echo "  aws apprunner describe-service --service-arn $SERVICE_ARN --query Service.Status"

  deploy-lambda:
    desc: Deploy to AWS Lambda + API Gateway (build and push Lambda image, apply OpenTofu)
    cmds:
      - task: _check-aws
      - task: _ecr-ensure-repo
      - task: _ecr-docker-push
        vars:
          IMAGE_NAME: portfolio-lambda
          DOCKERFILE: Dockerfile.lambda
          IMAGE_TAG: lambda-latest
      - |
        set -eu
        cd infra
        tofu apply \
          -target=aws_lambda_function.app \
          -target=aws_apigatewayv2_integration.lambda_proxy \
          -target=aws_apigatewayv2_route.lambda_default \
          -target=aws_apigatewayv2_stage.lambda_default \
          -target=aws_lambda_permission.allow_apigateway_invoke \
          --auto-approve
        echo "Lambda deployment complete!"
        tofu output lambda_api_url

  redeploy-lambda:
    desc: Push a new Lambda image and update function code
    cmds:
      - task: _ecr-docker-push
        vars:
          IMAGE_NAME: portfolio-lambda
          DOCKERFILE: Dockerfile.lambda
          IMAGE_TAG: lambda-latest
      - |
        set -eu
        ECR_URL=$(cd infra && tofu output -raw ecr_repository_url)
        FUNCTION_NAME=$(cd infra && tofu output -raw lambda_function_name)
        aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$ECR_URL:lambda-latest" >/dev/null
        echo "Lambda redeployment triggered. Check status with:"
        echo "  aws lambda get-function --function-name $FUNCTION_NAME --query 'Configuration.LastUpdateStatus'"

  # ── Troubleshoot ───────────────────────────────────────────────────────────

  logs:
    desc: Show App Runner instance logs
    cmds:
      - |
        set -eu
        SERVICE_ARN=$(cd infra && tofu output -raw app_runner_service_arn)
        aws apprunner list-instance-ids --service-arn "$SERVICE_ARN" --query 'InstanceIdList[0]' --output text | \
          xargs -I {} aws apprunner get-instance-logs --instance-id {} --service-arn "$SERVICE_ARN" --query 'LogStream' --output text

  local-logs:
    desc: Output logs from Docker container running via docker compose (useful with `task compose`)
    cmds:
      - |
        set -eu
        docker compose -f docker-compose.yml logs --tail=200 -f portfolio
