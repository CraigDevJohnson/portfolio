# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GOFLAGS: ""
  BINARY: "{{if eq OS \"windows\"}}portfolio-server.exe{{else}}portfolio-server{{end}}"
  TAILWIND_VERSION: v4.2.4
  TAILWIND_DIR: .tools/tailwind
  TAILWIND_BIN: "{{if eq OS
    \"windows\"}}{{.TAILWIND_DIR}}/tailwindcss.exe{{else}}{{.TAILWIND_DIR}}/tai\
    lwindcss{{end}}"
  TAILWIND_INPUT: cmd/web/tailwind/app.css
  TAILWIND_OUTPUT: cmd/web/static/css/tailwind.css

tasks:
  default:
    desc: Build the project
    deps: [ build ]
    silent: true

  # ── Build ──────────────────────────────────────────────────────────────────

  generate:
    desc: Generate Templ components
    deps: [ templ ]

  templ:
    desc: Low-level Templ generation command used by generate
    cmds:
      - |
        set -eu
        if ! command -v templ >/dev/null 2>&1; then
          echo "Templ not found -- please run 'task install-templ' to install it"
          exit 1
        fi
        templ generate

  tailwind-build:
    desc: Build Tailwind CSS from the CSS-first source files using the standalone CLI
    cmds:
      - |
        set -eu
        if [ ! -x "{{.TAILWIND_BIN}}" ]; then
          echo "Tailwind CLI not found -- please run 'task install-tailwind' to install it"
          exit 1
        fi
        "{{.TAILWIND_BIN}}" -i "{{.TAILWIND_INPUT}}" -o "{{.TAILWIND_OUTPUT}}"

  build:
    desc: Build the binary
    deps: [ generate, tailwind-build ]
    cmds:
      - "go build {{.GOFLAGS}} -o {{.BINARY}} ./cmd/server"

  # ── Run ────────────────────────────────────────────────────────────────────

  run:
    desc: Build and run the server
    deps: [ build ]
    cmds:
      - "{{if eq OS \"windows\"}}.\\{{.BINARY}}{{else}}./{{.BINARY}}{{end}}"

  compose:
    desc: Run with Docker Compose
    cmds:
      - docker compose -f docker-compose.yml up -d --build portfolio

  dev:
    desc: Run with air for hot-reload development
    cmds:
      - air

  tailwind-watch:
    desc: Watch Tailwind CSS source files and rebuild the generated stylesheet
    cmds:
      - |
        set -eu
        if [ ! -x "{{.TAILWIND_BIN}}" ]; then
          echo "Tailwind CLI not found -- please run 'task install-tailwind' to install it"
          exit 1
        fi
        "{{.TAILWIND_BIN}}" -i "{{.TAILWIND_INPUT}}" -o "{{.TAILWIND_OUTPUT}}" --watch

  # ── Quality ────────────────────────────────────────────────────────────────

  fmt:
    desc: Format Go source files
    cmds:
      - golangci-lint fmt --config .golangci.toml

  vet:
    desc: Run go vet
    cmds:
      - "go vet ./..."

  lint:
    desc: Lint Go source files
    cmds:
      - |
        set -eu
        if ! command -v golangci-lint >/dev/null 2>&1 || golangci-lint version --short 2>/dev/null | grep -qE '^[0-1]'; then
          echo "golangci-lint v2+ not found -- please run 'task install-lint' to install it"
          exit 1
        fi
        golangci-lint run --config .golangci.toml --fix

  ci:
    desc: Check quality, run tests and build the binary
    cmds:
      - task: clean
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: build

  # ── Test ───────────────────────────────────────────────────────────────────

  test:
    desc: Run tests
    cmds:
      - "go test -v ./..."

  # ── Clean ──────────────────────────────────────────────────────────────────

  clean:
    desc: Remove binary and clean cached files
    cmds:
      - "{{if eq OS \"windows\"}}powershell -Command \"Remove-Item -Force
        {{.BINARY}} -ErrorAction SilentlyContinue\"{{else}}rm -f
        {{.BINARY}}{{end}}"
      - "go clean"

  # ── Tools ──────────────────────────────────────────────────────────────────

  install-air:
    desc: Install air for hot-reload development
    cmds:
      - echo "Installing air for hot-reload development..."
      - "go install github.com/air-verse/air@latest"
      - echo "air installed successfully!"

  install-lint:
    desc: Install golangci-lint v2 for linting
    cmds:
      - |
        set -eu
        echo "Checking golangci-lint..."
        if ! command -v golangci-lint >/dev/null 2>&1 || golangci-lint version --short 2>/dev/null | grep -qE '^[0-1]'; then
          echo "golangci-lint not found or version is older than v2 -- installing latest (v2+)..."
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" latest
        fi
        echo "golangci-lint is installed and up to date!"

  install-tailwind:
    desc: Install the pinned Tailwind standalone CLI used by local builds, CI, and
      Docker
    cmds:
      - |
        set -eu
        os=$(uname -s)
        arch=$(uname -m)
        case "$os/$arch" in
          Darwin/arm64) asset="tailwindcss-macos-arm64" ;;
          Darwin/x86_64) asset="tailwindcss-macos-x64" ;;
          Linux/x86_64|Linux/amd64) asset="tailwindcss-linux-x64" ;;
          Linux/aarch64|Linux/arm64) asset="tailwindcss-linux-arm64" ;;
          *)
            echo "Unsupported platform for Tailwind CLI: $os/$arch"
            exit 1
            ;;
        esac
        mkdir -p "{{.TAILWIND_DIR}}"
        curl -fsSL -o "{{.TAILWIND_BIN}}" "https://github.com/tailwindlabs/tailwindcss/releases/download/{{.TAILWIND_VERSION}}/$asset"
        chmod +x "{{.TAILWIND_BIN}}"
        echo "Tailwind CLI {{.TAILWIND_VERSION}} installed to {{.TAILWIND_BIN}}"

  install-templ:
    desc: Install Templ
    cmds:
      - |
        go install github.com/a-h/templ/cmd/templ@latest

  install-tools:
    desc: Install all development tools
    deps: [ install-air, install-lint, install-tailwind ]
    cmds:
      - echo "All development tools installed successfully!"

  # ── Deploy ─────────────────────────────────────────────────────────────────

  deploy:
    desc: Deploy to AWS (build and push Docker image, apply Terraform)
    cmds:
      - |
        set -eu
        for cmd in tofu aws docker; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            echo "$cmd not found -- see DEPLOY-INSTRUCTIONS.md for installation steps"
            exit 1
          fi
        done
        if ! aws sts get-caller-identity >/dev/null 2>&1; then
          echo "AWS credentials not configured -- run 'aws configure' or export AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY"
          exit 1
        fi
        cd infra
        if [ ! -d .terraform ]; then
          tofu init
        fi
        tofu apply -target=aws_ecr_repository.app -target=aws_ecr_lifecycle_policy.app --auto-approve
        ECR_URL=$(tofu output -raw ecr_repository_url)
        AWS_REGION=$(echo "$ECR_URL" | sed 's/.*\.ecr\.\(.*\)\.amazonaws\.com.*/\1/')
        AWS_ACCOUNT_ID=$(echo "$ECR_URL" | sed 's/\..*//')
        aws ecr get-login-password --region "$AWS_REGION" | \
          docker login --username AWS --password-stdin \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
        cd ..
        docker build --platform linux/amd64 -t portfolio .
        docker tag portfolio:latest "$ECR_URL:latest"
        docker push "$ECR_URL:latest"
        cd infra
        tofu apply --auto-approve
        echo "Deployment complete!"
        tofu output app_runner_service_url

  redeploy:
    desc: Push a new image and trigger App Runner redeployment
    cmds:
      - |
        set -eu
        ECR_URL=$(cd infra && tofu output -raw ecr_repository_url)
        AWS_REGION=$(echo "$ECR_URL" | sed 's/.*\.ecr\.\(.*\)\.amazonaws\.com.*/\1/')
        AWS_ACCOUNT_ID=$(echo "$ECR_URL" | sed 's/\..*//')
        aws ecr get-login-password --region "$AWS_REGION" | \
          docker login --username AWS --password-stdin \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
        docker build --platform linux/amd64 -t portfolio .
        docker tag portfolio:latest "$ECR_URL:latest"
        docker push "$ECR_URL:latest"
        SERVICE_ARN=$(cd infra && tofu output -raw app_runner_service_arn)
        aws apprunner start-deployment --service-arn "$SERVICE_ARN"
        echo "Redeployment triggered. Check status with:"
        echo "  aws apprunner describe-service --service-arn $SERVICE_ARN --query Service.Status"

  # ── Troubleshoot ───────────────────────────────────────────────────────────

  logs:
    desc: Show App Runner instance logs
    cmds:
      - |
        set -eu
        SERVICE_ARN=$(cd infra && tofu output -raw app_runner_service_arn)
        aws apprunner list-instance-ids --service-arn "$SERVICE_ARN" --query 'InstanceIdList[0]' --output text | \
          xargs -I {} aws apprunner get-instance-logs --instance-id {} --service-arn "$SERVICE_ARN" --query 'LogStream' --output text

  local-logs:
    desc: Output logs from Docker container running from docker compose. Useful for
      local development with `task compose`.
    cmds:
      - |
        set -eu
        docker compose -f docker-compose.yml logs --tail=200 -f portfolio
