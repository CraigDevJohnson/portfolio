# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"
silent: true

vars:
  GOFLAGS: ""
  BINARY: '{{if eq OS "windows"}}portfolio-server.exe{{else}}portfolio-server{{end}}'
  BINARY_PATH: '{{if eq OS "windows"}}.\{{.BINARY}}{{else}}./{{.BINARY}}{{end}}'
  TAILWIND_VERSION: v4.2.4
  TAILWIND_DIR: .tools/tailwind
  TAILWIND_BIN: '{{if eq OS "windows"}}{{.TAILWIND_DIR}}/tailwindcss.exe{{else}}{{.TAILWIND_DIR}}/tailwindcss{{end}}'
  TAILWIND_INPUT: cmd/web/tailwind/app.css
  TAILWIND_OUTPUT: cmd/web/static/css/tailwind.css
  # The workloads account that runs the portfolio. Scripts read it from
  # PORTFOLIO_ACCOUNT_ID; each OpenTofu root has a matching aws_account_id input.
  AWS_ACCOUNT_ID: "793680745829"
  AWS_REGION: us-west-2
  ADMIN_PROFILE: workloads-admin
  STATE_BUCKET: portfolio-tofu-state-{{.AWS_ACCOUNT_ID}}
  ECR_URL: "{{.AWS_ACCOUNT_ID}}.dkr.ecr.{{.AWS_REGION}}.amazonaws.com/portfolio-lambda-releases"

env:
  PORTFOLIO_ACCOUNT_ID: "{{.AWS_ACCOUNT_ID}}"
  STATE_BUCKET: "{{.STATE_BUCKET}}"
  ECR_URL: "{{.ECR_URL}}"

tasks:
  default:
    desc: Build the project
    deps: [build]

  # ── Build ──────────────────────────────────────────────────────────────────

  generate:
    desc: Generate Templ components
    deps: [templ]

  templ:
    desc: Low-level Templ generation command used by generate
    cmds:
      - |
        if ! command -v templ >/dev/null 2>&1; then
          echo "Templ not found -- please run 'task install-templ' to install it"
          exit 1
        fi
        templ generate

  _tailwind-check:
    internal: true
    cmds:
      - |
        if [ ! -x "{{.TAILWIND_BIN}}" ]; then
          echo "Tailwind CLI not found -- please run 'task install-tailwind' to install it"
          exit 1
        fi

  tailwind-build:
    desc: Build Tailwind CSS from the CSS-first source files using the standalone CLI
    deps: [_tailwind-check]
    cmds:
      - '"{{.TAILWIND_BIN}}" -i "{{.TAILWIND_INPUT}}" -o "{{.TAILWIND_OUTPUT}}"'

  build:
    desc: Build the binary
    deps: [generate, tailwind-build]
    cmds:
      - "go build {{.GOFLAGS}} -o {{.BINARY}} ./cmd/server"

  build-image:
    desc: Build the local Linux server image without pushing or deploying
    env:
      BUILD_REVISION: '{{default "" .BUILD_REVISION}}'
      IMAGE_TAG: '{{default "portfolio:local" .IMAGE_TAG}}'
    cmds:
      - |
        set -eu
        ca_temp_dir="$(mktemp -d)"
        chmod 700 "$ca_temp_dir"
        trap 'rm -rf "$ca_temp_dir"' EXIT
        build_ca_bundle="$ca_temp_dir/build-ca.pem"
        runtime_ca_bundle="$ca_temp_dir/runtime-ca.pem"
        : > "$build_ca_bundle"
        : > "$runtime_ca_bundle"
        chmod 600 "$build_ca_bundle" "$runtime_ca_bundle"

        if [ -n "${DOCKER_BUILD_CA_CERT_PATH:-}" ]; then
          if [ ! -r "$DOCKER_BUILD_CA_CERT_PATH" ]; then
            echo "Docker build CA certificate is not readable: $DOCKER_BUILD_CA_CERT_PATH"
            exit 1
          fi
          cp "$DOCKER_BUILD_CA_CERT_PATH" "$build_ca_bundle"
        elif command -v security >/dev/null 2>&1 \
          && [ -r /Library/Keychains/System.keychain ]; then
          security find-certificate -a -c "Gateway CA" -p \
            /Library/Keychains/System.keychain > "$build_ca_bundle" || true
        fi

        if [ -n "${DOCKER_RUNTIME_CA_CERT_PATH:-}" ]; then
          if [ ! -r "$DOCKER_RUNTIME_CA_CERT_PATH" ]; then
            echo "Docker runtime CA certificate is not readable: $DOCKER_RUNTIME_CA_CERT_PATH"
            exit 1
          fi
          cp "$DOCKER_RUNTIME_CA_CERT_PATH" "$runtime_ca_bundle"
        fi

        if [ -z "$BUILD_REVISION" ]; then
          BUILD_REVISION="$(git rev-parse HEAD)"
        fi
        build_ca_digest=$(shasum -a 256 "$build_ca_bundle" | awk '{print $1}')
        runtime_ca_digest=$(shasum -a 256 "$runtime_ca_bundle" | awk '{print $1}')

        docker build --platform linux/amd64 \
          --secret "id=build_ca_bundle,src=$build_ca_bundle" \
          --secret "id=runtime_ca_bundle,src=$runtime_ca_bundle" \
          --build-arg "BUILD_CA_BUNDLE_DIGEST=$build_ca_digest" \
          --build-arg "RUNTIME_CA_BUNDLE_DIGEST=$runtime_ca_digest" \
          --build-arg "BUILD_REVISION=$BUILD_REVISION" \
          -f Dockerfile -t "$IMAGE_TAG" .

  build-lambda-image:
    desc: Build the local Linux Lambda image without pushing or deploying
    env:
      BUILD_REVISION: '{{default "" .BUILD_REVISION}}'
      IMAGE_TAG: '{{default "portfolio-lambda:local" .IMAGE_TAG}}'
    cmds:
      - |
        set -eu
        ca_temp_dir="$(mktemp -d)"
        chmod 700 "$ca_temp_dir"
        trap 'rm -rf "$ca_temp_dir"' EXIT
        build_ca_bundle="$ca_temp_dir/build-ca.pem"
        : > "$build_ca_bundle"
        chmod 600 "$build_ca_bundle"

        if [ -n "${DOCKER_BUILD_CA_CERT_PATH:-}" ]; then
          if [ ! -r "$DOCKER_BUILD_CA_CERT_PATH" ]; then
            echo "Docker build CA certificate is not readable: $DOCKER_BUILD_CA_CERT_PATH"
            exit 1
          fi
          cp "$DOCKER_BUILD_CA_CERT_PATH" "$build_ca_bundle"
        elif command -v security >/dev/null 2>&1 \
          && [ -r /Library/Keychains/System.keychain ]; then
          security find-certificate -a -c "Gateway CA" -p \
            /Library/Keychains/System.keychain > "$build_ca_bundle" || true
        fi

        if [ -z "$BUILD_REVISION" ]; then
          BUILD_REVISION="$(git rev-parse HEAD)"
        fi
        build_ca_digest=$(shasum -a 256 "$build_ca_bundle" | awk '{print $1}')

        docker build --provenance=false --sbom=false --platform linux/amd64 \
          --secret "id=build_ca_bundle,src=$build_ca_bundle" \
          --build-arg "BUILD_CA_BUNDLE_DIGEST=$build_ca_digest" \
          --build-arg "BUILD_REVISION=$BUILD_REVISION" \
          -f Dockerfile.lambda -t "$IMAGE_TAG" .

  # ── Run ────────────────────────────────────────────────────────────────────

  run:
    desc: Build and run the server
    deps: [build]
    dotenv: [".env"]
    cmds:
      - "{{.BINARY_PATH}}"

  portal-preview:
    desc: Build and run the mock management portal on loopback only
    deps: [build]
    dotenv: [".env"]
    env:
      APP_BIND_ALL: "false"
      HOST: "127.0.0.1"
      MGMT_LOCAL_PREVIEW: "true"
    cmds:
      - "{{.BINARY_PATH}}"

  compose:
    desc: Run with Docker Compose
    cmds:
      - |
        set -eu
        ca_temp_dir="$(mktemp -d)"
        chmod 700 "$ca_temp_dir"
        trap 'rm -rf "$ca_temp_dir"' EXIT
        build_ca_bundle="$ca_temp_dir/build-ca.pem"
        runtime_ca_bundle="$ca_temp_dir/runtime-ca.pem"
        : > "$build_ca_bundle"
        : > "$runtime_ca_bundle"
        chmod 600 "$build_ca_bundle" "$runtime_ca_bundle"

        if [ -n "${DOCKER_BUILD_CA_CERT_PATH:-}" ]; then
          if [ ! -r "$DOCKER_BUILD_CA_CERT_PATH" ]; then
            echo "Docker build CA certificate is not readable: $DOCKER_BUILD_CA_CERT_PATH"
            exit 1
          fi
          cp "$DOCKER_BUILD_CA_CERT_PATH" "$build_ca_bundle"
        elif command -v security >/dev/null 2>&1 \
          && [ -r /Library/Keychains/System.keychain ]; then
          security find-certificate -a -c "Gateway CA" -p \
            /Library/Keychains/System.keychain > "$build_ca_bundle" || true
        fi

        if [ -n "${DOCKER_RUNTIME_CA_CERT_PATH:-}" ]; then
          if [ ! -r "$DOCKER_RUNTIME_CA_CERT_PATH" ]; then
            echo "Docker runtime CA certificate is not readable: $DOCKER_RUNTIME_CA_CERT_PATH"
            exit 1
          fi
          cp "$DOCKER_RUNTIME_CA_CERT_PATH" "$runtime_ca_bundle"
        else
          cp "$build_ca_bundle" "$runtime_ca_bundle"
        fi

        build_ca_digest=$(shasum -a 256 "$build_ca_bundle" | awk '{print $1}')
        runtime_ca_digest=$(shasum -a 256 "$runtime_ca_bundle" | awk '{print $1}')
        DOCKER_BUILD_CA_CERT_PATH="$build_ca_bundle" \
        DOCKER_BUILD_CA_BUNDLE_DIGEST="$build_ca_digest" \
        DOCKER_RUNTIME_CA_CERT_PATH="$runtime_ca_bundle" \
        DOCKER_RUNTIME_CA_BUNDLE_DIGEST="$runtime_ca_digest" \
          docker compose -f docker-compose.yml up -d --build portfolio

  dev:
    desc: Run with air for hot-reload development
    cmds:
      - air

  tailwind-watch:
    desc: Watch Tailwind CSS source files and rebuild the generated stylesheet
    deps: [_tailwind-check]
    cmds:
      - '"{{.TAILWIND_BIN}}" -i "{{.TAILWIND_INPUT}}" -o "{{.TAILWIND_OUTPUT}}" --watch'

  # ── Quality ────────────────────────────────────────────────────────────────

  fmt:
    desc: Format files
    cmds:
      - printf "Formatting files...\n"
      - golangci-lint fmt

  vet:
    desc: Run go vet
    deps: [generate]
    cmds:
      - go vet ./...

  lint:
    desc: Lint files
    deps: [generate]
    cmds:
      - task: fmt
      - task: _lint-check

  test-images:
    desc: Verify both local Linux image contracts
    cmds:
      - sh tests/docker-runtime-ca.sh
      - sh tests/docker-lambda-image.sh

  infrastructure-ci:
    desc: Run the authoritative offline infrastructure gate
    cmds:
      - tofu fmt -check -recursive infra
      - tofu -chdir=infra init -backend=false -lockfile=readonly -input=false
      - tofu -chdir=infra validate
      - task: lambda-infrastructure-ci
      - sh tests/shared-root-config.sh

  lambda-infrastructure-ci:
    desc: Run the authoritative offline Lambda infrastructure and release gate
    cmds:
      - tofu fmt -check -recursive infra/lambda
      - task: cognito-dev-ci
      - tofu -chdir=infra/lambda/ci-roles init -backend=false -input=false
      - tofu -chdir=infra/lambda/ci-roles validate
      - tofu -chdir=infra/lambda/artifacts init -backend=false -input=false
      - tofu -chdir=infra/lambda/artifacts validate
      - tofu -chdir=infra/lambda/environments/dev init -backend=false -input=false
      - tofu -chdir=infra/lambda/environments/dev validate
      - tofu -chdir=infra/lambda/environments/prod init -backend=false -input=false
      - tofu -chdir=infra/lambda/environments/prod validate
      - tofu -chdir=infra/lambda/ci-roles test
      - go test ./infra/lambda -count=1
      - sh tests/management-input.sh
      - sh tests/release-scripts.sh
      - sh tests/operator-plan-apply.sh

  cognito-dev-ci:
    desc: Validate the isolated development Cognito root without backend or AWS access
    cmds:
      - tofu -chdir=infra/lambda/auth/dev fmt -check -recursive
      - tofu -chdir=infra/lambda/auth/dev init -backend=false -lockfile=readonly -input=false
      - tofu -chdir=infra/lambda/auth/dev validate
      - tofu -chdir=infra/lambda/auth/dev test
      - task: cognito-dev-tooling-test

  _lint-check:
    internal: true
    cmds:
      - printf "Running linters to check code quality...\n"
      - golangci-lint run
      - printf "All linters passed!\n"

  ci:
    desc: Check quality, run tests and build
    cmds:
      - task: clean
      - task: generate
      - task: fmt
      - task: vet
      - task: _lint-check
      - task: test
      - task: build

  # ── Test ───────────────────────────────────────────────────────────────────

  test:
    desc: Run tests
    deps: [generate]
    cmds:
      - go test -v ./...

  # ── Clean ──────────────────────────────────────────────────────────────────

  clean:
    desc: Remove binary and clean cached files
    cmds:
      - '{{if eq OS "windows"}}powershell -Command "Remove-Item -Force {{.BINARY}} -ErrorAction SilentlyContinue"{{else}}rm -f {{.BINARY}}{{end}}'
      - go clean

  # ── Tools ──────────────────────────────────────────────────────────────────

  install-air:
    desc: Install air for hot-reload development
    cmds:
      - |
        if command -v air >/dev/null 2>&1; then
          echo "air is already installed -- skipping installation"
          exit 0
        fi
        echo "Installing air for hot-reload development..."
        curl -sSfL https://raw.githubusercontent.com/cosmtrek/air/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
        echo "air installed successfully!"

  install-tailwind:
    desc: Install the pinned Tailwind standalone CLI used by local builds, CI, and Docker
    cmds:
      - |
        set -eu
        os=$(uname -s)
        arch=$(uname -m)
        case "$os/$arch" in
          Darwin/arm64) asset="tailwindcss-macos-arm64" ;;
          Darwin/x86_64) asset="tailwindcss-macos-x64" ;;
          Linux/x86_64|Linux/amd64) asset="tailwindcss-linux-x64" ;;
          Linux/aarch64|Linux/arm64) asset="tailwindcss-linux-arm64" ;;
          *)
            echo "Unsupported platform for Tailwind CLI: $os/$arch"
            exit 1
            ;;
        esac
        mkdir -p "{{.TAILWIND_DIR}}"
        curl -fsSL -o "{{.TAILWIND_BIN}}" "https://github.com/tailwindlabs/tailwindcss/releases/download/{{.TAILWIND_VERSION}}/$asset"
        chmod +x "{{.TAILWIND_BIN}}"
        echo "Tailwind CLI {{.TAILWIND_VERSION}} installed to {{.TAILWIND_BIN}}"

  install-templ:
    desc: Install the Templ version used by this repository
    cmds:
      - go install github.com/a-h/templ/cmd/templ@v0.3.1020

  install-golangci-lint:
    desc: Install the golangci-lint version used by this repository
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0

  install-tools:
    desc: Install all development tools
    deps: [install-air, install-golangci-lint, install-tailwind, install-templ]
    cmds:
      - echo "All development tools installed successfully!"

  # ── Deploy ─────────────────────────────────────────────────────────────────
  #
  # Operator tasks run as Craig's WorkloadsAdmin SSO session (ADMIN_PROFILE):
  # run `aws sso login` first. A plan task saves PLAN_FILE (an absolute path)
  # and prints it; an apply task applies only that saved plan. See
  # DEPLOY-INSTRUCTIONS.md. The lambda-ci-* tasks run inside the Release
  # workflow with GitHub OIDC roles.
  #
  # Applying a saved plan, OpenTofu re-reads *.auto.tfvars and -var flags and
  # refuses any input whose raw value differs from the plan's. A -var value
  # never matches the same value from a file (the plan keeps "true", the file
  # gives true). So the environment tasks pass -var only for inputs no tfvars
  # file sets, and turn ACTIVATE_CUSTOM_DOMAIN into a flag only when it is
  # given, through one definition (DOMAIN_VAR) that plan and apply share.

  _admin-identity-check:
    internal: true
    env: &admin-env
      AWS_PROFILE: "{{.ADMIN_PROFILE}}"
      AWS_REGION: "{{.AWS_REGION}}"
    cmds:
      - |
        set -eu
        test "${AWS_PROFILE:-}" = "{{.ADMIN_PROFILE}}" || {
          echo "AWS_PROFILE must be {{.ADMIN_PROFILE}}; unset it or set it to {{.ADMIN_PROFILE}}" >&2
          exit 1
        }
        for variable in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
          if printenv "$variable" > /dev/null; then
            echo "$variable must be unset; use the {{.ADMIN_PROFILE}} SSO profile" >&2
            exit 1
          fi
        done
        arn=$(aws sts get-caller-identity --query Arn --output text)
        case "$arn" in
          "arn:aws:sts::{{.AWS_ACCOUNT_ID}}:assumed-role/AWSReservedSSO_WorkloadsAdmin_"*) ;;
          *)
            echo "AWS identity must be WorkloadsAdmin in account {{.AWS_ACCOUNT_ID}}" >&2
            exit 1
            ;;
        esac

  _lambda-root-init:
    internal: true
    env: *admin-env
    requires:
      vars: [ROOT]
    cmds:
      - task: _admin-identity-check
      - |
        set -eu
        tofu -chdir="{{.ROOT}}" init -backend-config=backend.hcl -reconfigure -input=false
        workspace=$(tofu -chdir="{{.ROOT}}" workspace show)
        test "$workspace" = default || {
          echo "Refusing non-default OpenTofu workspace: $workspace" >&2
          exit 1
        }

  _lambda-root-plan:
    internal: true
    env: *admin-env
    requires:
      vars: [ROOT, PLAN_FILE]
    cmds:
      - task: _admin-identity-check
      - |
        set -eu
        case "{{.PLAN_FILE}}" in
          /*) ;;
          *) echo "PLAN_FILE must be an absolute path" >&2; exit 1 ;;
        esac
        test ! -e "{{.PLAN_FILE}}" || {
          echo "Refusing existing PLAN_FILE: {{.PLAN_FILE}}" >&2
          exit 1
        }
        tofu -chdir="{{.ROOT}}" plan -lock-timeout=5m -input=false -out="{{.PLAN_FILE}}" {{.PLAN_ARGS}}
        tofu -chdir="{{.ROOT}}" show -no-color "{{.PLAN_FILE}}"

  _lambda-root-apply:
    internal: true
    env: *admin-env
    requires:
      vars: [ROOT, PLAN_FILE]
    cmds:
      - task: _admin-identity-check
      - tofu -chdir="{{.ROOT}}" apply -lock-timeout=5m -input=false {{.APPLY_ARGS}} "{{.PLAN_FILE}}"

  lambda-ci-roles-init:
    desc: Initialize the account root (CI roles, execution boundary, state bucket)
    cmds:
      - task: _lambda-root-init
        vars: { ROOT: infra/lambda/ci-roles }

  lambda-ci-roles-plan:
    desc: Save an account root plan to PLAN_FILE for review
    requires:
      vars: [PLAN_FILE]
    cmds:
      - task: _lambda-root-plan
        vars: { ROOT: infra/lambda/ci-roles, PLAN_FILE: "{{.PLAN_FILE}}" }

  lambda-ci-roles-apply:
    desc: Apply a reviewed account root plan from PLAN_FILE
    requires:
      vars: [PLAN_FILE]
    cmds:
      - task: _lambda-root-apply
        vars: { ROOT: infra/lambda/ci-roles, PLAN_FILE: "{{.PLAN_FILE}}" }

  lambda-artifacts-init:
    desc: Initialize the release artifact root
    cmds:
      - task: _lambda-root-init
        vars: { ROOT: infra/lambda/artifacts }

  lambda-artifacts-plan:
    desc: Save a release artifact plan to PLAN_FILE for review
    requires:
      vars: [PLAN_FILE]
    cmds:
      - task: _lambda-root-plan
        vars: { ROOT: infra/lambda/artifacts, PLAN_FILE: "{{.PLAN_FILE}}" }

  lambda-artifacts-apply:
    desc: Apply a reviewed release artifact plan from PLAN_FILE
    requires:
      vars: [PLAN_FILE]
    cmds:
      - task: _lambda-root-apply
        vars: { ROOT: infra/lambda/artifacts, PLAN_FILE: "{{.PLAN_FILE}}" }

  lambda-dev-init:
    desc: Initialize the development root
    cmds:
      - task: _lambda-root-init
        vars: { ROOT: infra/lambda/environments/dev }

  lambda-dev-plan:
    desc: Save a development plan for IMAGE_DIGEST to PLAN_FILE (ACTIVATE_CUSTOM_DOMAIN=false plans without the hostname)
    requires:
      vars: [IMAGE_DIGEST, PLAN_FILE]
    vars: &domain-var
      DOMAIN_VAR: "{{if .ACTIVATE_CUSTOM_DOMAIN}}-var activate_custom_domain={{.ACTIVATE_CUSTOM_DOMAIN}}{{end}}"
    cmds:
      - task: _lambda-root-plan
        vars:
          ROOT: infra/lambda/environments/dev
          PLAN_FILE: "{{.PLAN_FILE}}"
          PLAN_ARGS: >-
            -var ecr_repository_url={{.ECR_URL}}
            -var image_digest={{.IMAGE_DIGEST}}
            {{.DOMAIN_VAR}}

  lambda-dev-apply:
    desc: Apply a reviewed development plan from PLAN_FILE (with the plan's ACTIVATE_CUSTOM_DOMAIN, if any)
    requires:
      vars: [PLAN_FILE]
    vars: *domain-var
    cmds:
      - task: _lambda-root-apply
        vars:
          ROOT: infra/lambda/environments/dev
          PLAN_FILE: "{{.PLAN_FILE}}"
          APPLY_ARGS: "{{.DOMAIN_VAR}}"

  lambda-prod-init:
    desc: Initialize the production root
    cmds:
      - task: _lambda-root-init
        vars: { ROOT: infra/lambda/environments/prod }

  lambda-prod-plan:
    desc: Save a production plan for IMAGE_DIGEST to PLAN_FILE (ACTIVATE_CUSTOM_DOMAIN=false plans without the hostnames)
    requires:
      vars: [IMAGE_DIGEST, PLAN_FILE]
    vars: *domain-var
    cmds:
      - task: _lambda-root-plan
        vars:
          ROOT: infra/lambda/environments/prod
          PLAN_FILE: "{{.PLAN_FILE}}"
          PLAN_ARGS: >-
            -var ecr_repository_url={{.ECR_URL}}
            -var image_digest={{.IMAGE_DIGEST}}
            -var 'alarm_action_arns=["arn:aws:sns:{{.AWS_REGION}}:{{.AWS_ACCOUNT_ID}}:alerts"]'
            {{.DOMAIN_VAR}}

  lambda-prod-apply:
    desc: Apply a reviewed production plan from PLAN_FILE (with the plan's ACTIVATE_CUSTOM_DOMAIN, if any)
    requires:
      vars: [PLAN_FILE]
    vars: *domain-var
    cmds:
      - task: _lambda-root-apply
        vars:
          ROOT: infra/lambda/environments/prod
          PLAN_FILE: "{{.PLAN_FILE}}"
          APPLY_ARGS: "{{.DOMAIN_VAR}}"

  lambda-release-push:
    desc: Build and push one immutable full-SHA Lambda release image
    env: *admin-env
    cmds:
      - task: _admin-identity-check
      - |
        set -eu
        test -z "$(git status --porcelain)" || {
          echo "Lambda releases require a clean Git worktree" >&2
          exit 1
        }
        build_revision=$(git rev-parse HEAD)
        release_tag="git-$build_revision"
        image_uri="{{.ECR_URL}}:$release_tag"
        lookup_error=$(mktemp)
        trap 'rm -f "$lookup_error"' EXIT
        if aws ecr describe-images --repository-name portfolio-lambda-releases \
          --image-ids imageTag="$release_tag" > /dev/null 2> "$lookup_error"; then
          echo "Release tag $release_tag already exists; the repository uses immutable tags" >&2
          exit 1
        fi
        grep -Fq 'ImageNotFoundException' "$lookup_error" || {
          cat "$lookup_error" >&2
          exit 1
        }
        task build-lambda-image BUILD_REVISION="$build_revision" IMAGE_TAG="$image_uri"
        registry=$(printf '%s\n' "{{.ECR_URL}}" | cut -d/ -f1)
        aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
        docker push "$image_uri"
        # ECR briefly reports ScanNotFoundException before the scan record exists.
        attempt=0
        until aws ecr describe-image-scan-findings --repository-name portfolio-lambda-releases \
          --image-id imageTag="$release_tag" --no-paginate > /dev/null 2> "$lookup_error"; do
          grep -Fq 'ScanNotFoundException' "$lookup_error" && [ "$attempt" -lt 12 ] || {
            cat "$lookup_error" >&2
            exit 1
          }
          attempt=$((attempt + 1))
          sleep 5
        done
        aws ecr wait image-scan-complete --repository-name portfolio-lambda-releases \
          --image-id imageTag="$release_tag"
        aws ecr describe-images --repository-name portfolio-lambda-releases \
          --image-ids imageTag="$release_tag" \
          --query 'imageDetails[0].{Digest:imageDigest,PushedAt:imagePushedAt}' --output json
        aws ecr describe-image-scan-findings --repository-name portfolio-lambda-releases \
          --image-id imageTag="$release_tag" --no-paginate \
          --query '{ScanStatus:imageScanStatus.status,FindingSeverityCounts:imageScanFindings.findingSeverityCounts}' \
          --output json

  # ── Release workflow (GitHub Actions) ──────────────────────────────────────

  lambda-ci-authorize-release:
    desc: Classify one trusted main commit for the Release workflow
    cmds:
      - sh scripts/authorize-ci-lambda-release.sh

  lambda-ci-check-current-main:
    desc: Fail unless SOURCE_SHA is still the tip of main
    cmds:
      - sh scripts/check-current-main.sh "$SOURCE_SHA"

  lambda-ci-check-aws-identity:
    desc: Verify the exact GitHub Actions AWS role (EXPECTED_ROLE_ARN) before release work
    cmds:
      - sh scripts/check-ci-aws-identity.sh "$EXPECTED_ROLE_ARN"

  lambda-ci-build-release-image:
    desc: Build or reuse, scan, and report one immutable Lambda release image
    env:
      ECR_REPOSITORY: portfolio-lambda-releases
    cmds:
      - sh scripts/build-ci-lambda-release.sh

  lambda-ci-deploy-development:
    desc: Plan, apply and verify one development release
    cmds:
      - sh scripts/deploy-ci-lambda-development.sh

  lambda-ci-plan-production:
    desc: Save the production plan for the image that development verified
    cmds:
      - sh scripts/plan-ci-lambda-production.sh

  lambda-ci-apply-production:
    desc: Apply the approved production plan from the same Release run and verify it
    cmds:
      - sh scripts/apply-ci-lambda-production.sh

  local-logs:
    desc: Output logs from Docker container running via docker compose (useful with `task compose`)
    cmds:
      - |
        set -eu
        docker compose -f docker-compose.yml logs --tail=200 -f portfolio

  cognito-dev-init:
    desc: Initialize isolated private development auth backend (requires lock acknowledgement)
    env: *admin-env
    cmds:
      - python3 scripts/create-cognito-dev-plan.py init

  cognito-dev-plan:
    desc: Create private development auth plan and allowlisted review summary
    env: *admin-env
    cmds:
      - python3 scripts/create-cognito-dev-plan.py plan

  cognito-dev-apply:
    desc: Apply separately approved development auth plan and provenance checksums
    env: *admin-env
    cmds:
      - python3 scripts/create-cognito-dev-plan.py apply

  cognito-dev-export:
    desc: Export only validated management runtime public settings
    env: *admin-env
    cmds:
      - python3 scripts/create-cognito-dev-plan.py export

  cognito-dev-tooling-test:
    desc: Exercise private auth tooling offline with sentinel secrets
    cmds:
      - python3 -m unittest discover -s scripts -p 'test_cognito_dev_plan.py'
