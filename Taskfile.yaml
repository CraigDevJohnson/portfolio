  deploy-lambda:
    desc: LEGACY STATE - target Lambda resources in the shared stack
    cmds:
      - task: _check-aws
      - task: _ecr-ensure-repo
      - task: _ecr-docker-push
        vars:
          IMAGE_NAME: portfolio-lambda
          DOCKERFILE: Dockerfile.lambda
          IMAGE_TAG: lambda-latest
      - |
        set -eu
        cd infra
        tofu apply \
          -target=aws_lambda_function.app \
          -target=aws_apigatewayv2_integration.lambda_proxy \
          -target=aws_apigatewayv2_route.lambda_default \
          -target=aws_apigatewayv2_stage.lambda_default \
          -target=aws_lambda_permission.allow_apigateway_invoke \
          --auto-approve
        echo "Lambda deployment complete!"
        tofu output lambda_api_url

  redeploy-lambda:
    desc: LEGACY STATE - push lambda-latest and update function code
    cmds:
      - task: _ecr-docker-push
        vars:
          IMAGE_NAME: portfolio-lambda
          DOCKERFILE: Dockerfile.lambda
          IMAGE_TAG: lambda-latest
      - |
        set -eu
        ECR_URL=$(cd infra && tofu output -raw ecr_repository_url)
        FUNCTION_NAME=$(cd infra && tofu output -raw lambda_function_name)
        aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$ECR_URL:lambda-latest" >/dev/null
        echo "Lambda redeployment triggered. Check status with:"
        echo "  aws lambda get-function --function-name $FUNCTION_NAME --query 'Configuration.LastUpdateStatus'"

  local-logs:
    desc: Output logs from Docker container running via docker compose (useful with `task compose`)
    cmds:
      - |
        set -eu
        docker compose -f docker-compose.yml logs --tail=200 -f portfolio
