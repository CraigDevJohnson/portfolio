config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/*_test.go",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"
version = "1.7.12"

[[plugin]]
name = "editorconfig-checker"
mode = "comment"

[[plugin]]
name = "gofmt"

[[plugin]]
name = "golangci-lint"
mode = "comment"
version = "2.12.2"

[[plugin]]
name = "hadolint"
version = "2.14.0"

[[plugin]]
name = "osv-scanner"
version = "2.3.8"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"
version = "3.95.5"

[[plugin]]
name = "zizmor"
version = "1.25.2"

[[plugin]]
name = "markdownlint"
mode = "comment"
config_files = [".qlty/configs/.markdownlint.yaml"]

[[plugin]]
name = "shellcheck"
version = "0.11.0"

[[plugin]]
name = "radarlint-go"
mode = "monitor"

[[plugin]]
name = "radarlint"
config_files = [".qlty/configs/radarlint.properties"]

[[plugin]]
name = "radarlint-iac"
mode = "monitor"
config_files = [".qlty/configs/radarlint.properties"]

[[plugin]]
name = "dockerfmt"
version = "0.5.2"
config_files = [".editorconfig"]

[[plugin]]
name = "checkov"
version = "3.2.530"

[[plugin]]
name = "dotenv-linter"
mode = "comment"
version = "4.0.0"

[[plugin]]
name = "yamllint"
version = "1.38.0"

[[plugin]]
name = "gitleaks"
version = "8.30.1"
