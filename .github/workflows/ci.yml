name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Install repository tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0
          task install-tailwind

      - name: Run repository gate
        run: |
          task ci
          git diff --exit-code

      - name: Verify module graph
        run: |
          go mod tidy -diff
          go mod verify

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install infrastructure test tools
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra

      - name: Validate infrastructure roots without backends
        run: |
          tofu -chdir=infra init -backend=false -input=false
          tofu -chdir=infra validate
          tofu -chdir=infra/lambda/artifacts init -backend=false -input=false
          tofu -chdir=infra/lambda/artifacts validate
          tofu -chdir=infra/lambda/environments/dev init -backend=false -input=false
          tofu -chdir=infra/lambda/environments/dev validate
          tofu -chdir=infra/lambda/environments/prod init -backend=false -input=false
          tofu -chdir=infra/lambda/environments/prod validate

      - name: Run real OpenTofu mock contracts
        run: go test ./infra/lambda -count=1

      - name: Run offline deployment command contracts
        run: |
          sh tests/lambda-observation-window.sh
          sh tests/lambda-plan-contract.sh
          sh tests/legacy-root-retirement-config.sh
          sh tests/portfolio-deployer-retirement-policy.sh
          sh tests/app-runner-retirement-plan.sh
          sh tests/app-runner-retirement-preflight.sh
          sh tests/app-runner-retirement-tasks.sh
