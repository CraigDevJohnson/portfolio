name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write
  pull-requests: read

concurrency:
  group: release-dispatch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: "180294223248"
  ECR_REPOSITORY: portfolio-lambda-releases
  ECR_URL: 180294223248.dkr.ecr.us-west-2.amazonaws.com/portfolio-lambda-releases
  STATE_BUCKET: portfolio-tofu-state-180294223248

jobs:
  authorize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      source_sha: ${{ steps.authorize.outputs.source_sha }}
      base_sha: ${{ steps.reviewed.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          sh scripts/check-current-main.sh "$EVENT_SHA"
          echo "source_sha=$EVENT_SHA" >>"$GITHUB_OUTPUT"
      - id: reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
        run: echo "base_sha=$(sh scripts/resolve-reviewed-release-base.sh "$SOURCE_SHA")" >>"$GITHUB_OUTPUT"
      - id: classify
        env:
          BASE_SHA: ${{ steps.reviewed.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
        run: echo "classification=$(sh scripts/classify-release-change.sh "$BASE_SHA" "$SOURCE_SHA")" >>"$GITHUB_OUTPUT"
      - if: steps.classify.outputs.classification == 'review'
        run: |
          echo 'Infrastructure, workflow, deployment-authority, mixed, or unknown change requires a reviewed plan.' >&2
          exit 1

  build:
    needs: authorize
    if: needs.authorize.outputs.classification == 'development'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
      - name: Check source authority before requesting AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: sh scripts/check-current-main.sh "$SOURCE_SHA"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_BUILDER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: sh scripts/check-ci-aws-identity.sh '${{ vars.AWS_RELEASE_BUILDER_ROLE_ARN }}'
      - uses: docker/setup-buildx-action@v4
      - id: image
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          tag="git-$SOURCE_SHA"
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].imageTagMutability' --output text | grep -Fx IMMUTABLE
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
            echo 'Immutable full-SHA tag already exists; reusing it for scan validation.'
          else
            aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_URL%%/*}"
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
              --build-arg "BUILD_REVISION=$SOURCE_SHA" -f Dockerfile.lambda -t "$ECR_URL:$tag" --push .
          fi
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$digest"
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$digest" >scan.json
          jq -e '.imageScanStatus.status == "COMPLETE" and ((.imageScanFindings.findingSeverityCounts.CRITICAL // 0) == 0)' scan.json
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.authorize.outputs.source_sha }}
          path: scan.json
          retention-days: 90
          if-no-files-found: error

  development:
    needs: [authorize, build]
    if: needs.authorize.outputs.classification == 'development'
    environment: development
    concurrency:
      group: lambda-development
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.source_sha }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Check source authority before requesting AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: sh scripts/check-current-main.sh "$SOURCE_SHA"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEVELOPMENT_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: sh scripts/check-ci-aws-identity.sh '${{ vars.AWS_DEVELOPMENT_DEPLOYER_ROLE_ARN }}'
      - name: Plan, policy-check, checksum, and apply
        env:
          AUTOMATED_RELEASE: "true"
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          sh scripts/check-ci-state-bucket.sh
          mkdir evidence
          tofu -chdir=infra/lambda/environments/dev init -backend-config=backend.hcl -input=false
          TF_VAR_ecr_repository_url="$ECR_URL" TF_VAR_image_digest="$IMAGE_DIGEST" \
            tofu -chdir=infra/lambda/environments/dev plan -lock-timeout=5m -input=false -out="$GITHUB_WORKSPACE/evidence/dev.tfplan"
          tofu -chdir=infra/lambda/environments/dev show -json "$GITHUB_WORKSPACE/evidence/dev.tfplan" >evidence/plan.json
          tofu -chdir=infra/lambda/environments/dev show -no-color "$GITHUB_WORKSPACE/evidence/dev.tfplan" >evidence/plan.txt
          PLAN_JSON="$GITHUB_WORKSPACE/evidence/plan.json" ENVIRONMENT=dev NAME_PREFIX=portfolio-lambda-dev \
            IMAGE_URI="$ECR_URL@$IMAGE_DIGEST" EXPECTED_ALARM_ACTIONS_JSON='[]' sh scripts/check-lambda-plan.sh | tee evidence/policy.txt
          sha256sum evidence/dev.tfplan | tee evidence/plan.sha256
          aws lambda get-alias --function-name portfolio-lambda-dev --name live --output json >evidence/alias-before.json 2>/dev/null || printf '{}\n' >evidence/alias-before.json
          sh scripts/check-current-main.sh "$SOURCE_SHA"
          tofu -chdir=infra/lambda/environments/dev apply -input=false "$GITHUB_WORKSPACE/evidence/dev.tfplan"
          tofu -chdir=infra/lambda/environments/dev output -json >evidence/outputs.json
          if ! BASE_URL=https://dev.craigdevjohnson.com SOURCE_SHA="$SOURCE_SHA" IMAGE_DIGEST="$IMAGE_DIGEST" \
            FUNCTION_NAME=portfolio-lambda-dev EVIDENCE_DIR=evidence sh scripts/verify-lambda-release.sh; then
            prior=$(jq -r '.FunctionVersion // empty' evidence/alias-before.json)
            if printf '%s' "$prior" | grep -Eq '^[0-9]+$'; then
              TF_VAR_ecr_repository_url="$ECR_URL" TF_VAR_image_digest="$IMAGE_DIGEST" TF_VAR_live_version_override="$prior" \
                tofu -chdir=infra/lambda/environments/dev plan -lock-timeout=5m -input=false -out="$GITHUB_WORKSPACE/evidence/rollback.tfplan"
              sha256sum evidence/rollback.tfplan >evidence/rollback.sha256
              echo 'Rollback is saved but requires operator review and checked apply.' >evidence/ROLLBACK_REQUIRES_APPROVAL
            fi
            exit 1
          fi
          deployment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" \
            -f ref="$SOURCE_SHA" -f environment=development -F auto_merge=false \
            -f description="Lambda $IMAGE_DIGEST" --jq .id)
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success -f environment=development -f environment_url=https://dev.craigdevjohnson.com \
            -f description="Verified $SOURCE_SHA at $IMAGE_DIGEST" >/dev/null
          jq -n --argjson deployment_id "$deployment_id" --arg source_sha "$SOURCE_SHA" --arg image_digest "$IMAGE_DIGEST" \
            '{deployment_id:$deployment_id,source_sha:$source_sha,image_digest:$image_digest}' >evidence/github-deployment.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-evidence-${{ needs.authorize.outputs.source_sha }}
          path: evidence/
          retention-days: 90

  production-plan:
    needs: authorize
    if: needs.authorize.outputs.classification == 'production'
    environment: production-plan
    concurrency:
      group: lambda-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {ref: "${{ needs.authorize.outputs.source_sha }}", fetch-depth: 0}
      - uses: opentofu/setup-opentofu@v2
        with: {tofu_version: 1.12.6, tofu_wrapper: false}
      - name: Check source authority before requesting AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: sh scripts/check-current-main.sh "$SOURCE_SHA"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_PLANNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: sh scripts/check-ci-aws-identity.sh '${{ vars.AWS_PRODUCTION_PLANNER_ROLE_ARN }}'
      - name: Validate promotion and create plan only
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$BASE_SHA" "$RELEASE_COMMIT")" = deploy/production-release.json
          sh scripts/validate-production-release.sh deploy/production-release.json
          source_sha=$(jq -er '.source_sha | select(test("^[0-9a-f]{40}$"))' deploy/production-release.json)
          digest=$(jq -er '.image_digest | select(test("^sha256:[0-9a-f]{64}$"))' deploy/production-release.json)
          deployment_id=$(jq -er '.development_deployment_id | select(type == "number")' deploy/production-release.json)
          mkdir evidence
          printf '{"source_sha":"%s","image_digest":"%s","development_deployment_id":%s}\n' \
            "$source_sha" "$digest" "$deployment_id" >evidence/promotion.json
          sh scripts/check-current-main.sh "$RELEASE_COMMIT"
          sh scripts/check-ci-state-bucket.sh
          tofu -chdir=infra/lambda/environments/prod init -backend-config=backend.hcl -input=false
          TF_VAR_ecr_repository_url="$ECR_URL" TF_VAR_image_digest="$digest" TF_VAR_alarm_action_arns='["arn:aws:sns:us-west-2:180294223248:portfolio-lambda-prod-alerts"]' \
            tofu -chdir=infra/lambda/environments/prod plan -lock-timeout=5m -input=false -out="$GITHUB_WORKSPACE/evidence/prod.tfplan"
          tofu -chdir=infra/lambda/environments/prod show -json "$GITHUB_WORKSPACE/evidence/prod.tfplan" >evidence/plan.json
          PLAN_JSON="$GITHUB_WORKSPACE/evidence/plan.json" ENVIRONMENT=prod NAME_PREFIX=portfolio-lambda-prod \
            IMAGE_URI="$ECR_URL@$digest" EXPECTED_ALARM_ACTIONS_JSON='["arn:aws:sns:us-west-2:180294223248:portfolio-lambda-prod-alerts"]' sh scripts/check-lambda-plan.sh
          sha256sum evidence/prod.tfplan >evidence/plan.sha256
          echo 'Production is plan-only until public Lambda cutover prerequisites are independently verified.' >evidence/PLAN_ONLY
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          RELEASE_COMMIT: ${{ needs.authorize.outputs.source_sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: production-plan-${{ needs.authorize.outputs.source_sha }}
          path: evidence/
          retention-days: 90
